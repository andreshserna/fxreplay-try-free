name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Static checks: formatting, lint, types, and the project's own rules.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:tokens
      - run: npm run check:contrast
      - run: npm run gen:check

      # Tests: the AI system's hooks and checkers, then the API contract in Node.
      - run: npm run test:system
      - run: npm test

      - run: npm run build

      # Against the built Worker and a real local D1: the contract over HTTP, the signup in a
      # real browser with axe, then the Lighthouse budgets. A missed budget fails the build.
      - name: Contract tests, end-to-end tests and performance budgets
        run: |
          # Without this the step's status would be tee's, and a failed check would pass.
          set -o pipefail
          # The preview server may stay in the foreground on a runner, so it is sent to the
          # background here and awaited by polling.
          npm run preview -- --port 4321 --host 127.0.0.1 > preview.log 2>&1 &
          curl --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:4321/ || { cat preview.log; exit 1; }
          npm run test:api || { cat preview.log; exit 1; }
          npx playwright install --with-deps chromium
          npm run test:e2e || { cat preview.log; exit 1; }
          # Five runs: on a shared runner one slow run in three moved the median past a budget.
          npm run lighthouse -- --runs 5 | tee lighthouse.txt

      # SEO is judged on a build that may be indexed. The flag is read at build time, so the
      # first preview is stopped and `npm run preview` builds again with it on. Another port,
      # so a server that failed to stop can never be the one audited. The reports go to their
      # own directory, inside the uploaded one, so the first run's reports are kept.
      - name: SEO budget on an indexable build
        env:
          ALLOW_INDEXING: 'true'
        run: |
          set -o pipefail
          npx astro preview stop
          npm run preview -- --port 4322 --host 127.0.0.1 > preview-seo.log 2>&1 &
          curl --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --output /dev/null http://127.0.0.1:4322/ || { cat preview-seo.log; exit 1; }
          # Three runs: the check judges every budget again here, not SEO alone, and a single
          # run on a shared runner is too noisy for the timing budgets.
          LIGHTHOUSE_BASE_URL=http://127.0.0.1:4322 npm run lighthouse -- --seo --runs 3 --out .artifacts/lighthouse/seo | tee lighthouse-seo.txt

      # The Lighthouse table on the run's own page and the full reports to download, whether
      # the budgets were met or not: a missed budget can then be read, not only seen.
      - name: Show the Lighthouse results on the run's page
        if: always()
        run: |
          if [ -f lighthouse.txt ]; then
            { echo '## Lighthouse, mobile profile'; echo; echo '```'; cat lighthouse.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f lighthouse-seo.txt ]; then
            { echo '## Lighthouse, mobile profile, indexable build (SEO judged)'; echo; echo '```'; cat lighthouse-seo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .artifacts/lighthouse/
          include-hidden-files: true
          if-no-files-found: ignore
